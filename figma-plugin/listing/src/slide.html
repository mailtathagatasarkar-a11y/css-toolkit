<!doctype html>
<!-- Figma Community listing images: renders the real plugin UI (../../ui.html) beside a headline.
     Query: ?mode=<tool>&title=<headline>&kicker=<eyebrow>&text=<body>&cover=1 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #f4b506; --ink: #f5f4ef; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
    body { display: grid; grid-template-columns: 1fr 520px; align-items: center; gap: 96px; padding: 0 150px 0 160px; background: radial-gradient(ellipse 60% 70% at 72% 60%, var(--glow, #3c3528) 0%, transparent 70%), linear-gradient(155deg, #25282b 0%, #171b1e 58%, #111518 100%); color: var(--ink); font-family: "DM Sans", sans-serif; }
    .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 64px; font-family: "Space Grotesk", sans-serif; font-size: 30px; font-weight: 700; }
    .brand img { width: 52px; height: 52px; border-radius: 12px; }
    .kicker { display: flex; align-items: center; gap: 16px; color: var(--accent); font-size: 22px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    .kicker::before { content: ""; width: 48px; height: 3px; background: var(--accent); }
    h1 { margin: 22px 0 0; font-family: "Space Grotesk", sans-serif; font-size: 96px; line-height: .98; letter-spacing: -.045em; }
    p { max-width: 820px; margin: 30px 0 0; color: #a3a5a8; font-size: 32px; line-height: 1.4; }
    .chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 48px; }
    .chips span { padding: 12px 20px; border-radius: 12px; background: var(--c); color: var(--t, #111); font-size: 20px; font-weight: 700; letter-spacing: .06em; }
    .window { width: 520px; height: 1010px; overflow: hidden; border: 1px solid rgba(255,255,255,.08); border-radius: 18px; background: #2c2c2c; box-shadow: 0 40px 120px rgba(0,0,0,.5); }
    .window header { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 18px; border-bottom: 1px solid rgba(255,255,255,.08); color: #e6e6e6; font-size: 17px; font-weight: 600; }
    .window header i { width: 22px; height: 22px; border-radius: 5px; background: url("../../../favicon.svg") center / cover; }
    .window header b { margin-left: auto; color: #8c8d90; font-weight: 400; }
    iframe { display: block; width: 400px; height: 740px; border: 0; transform: scale(1.3); transform-origin: 0 0; }
  </style>
</head>
<body>
  <section>
    <div class="brand"><img src="../../../favicon.svg" alt="">CSS Toolkit</div>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <p id="text"></p>
    <div class="chips" id="chips"></div>
  </section>
  <div class="window"><header><i></i>CSS Toolkit<b>✕</b></header><iframe id="plugin" src="../../ui.html"></iframe></div>
  <script>
    const q = new URLSearchParams(location.search);
    const accents = { rem: ["#f4b506", "#3c3528"], em: ["#ff5102", "#3a2d2c"], vw: ["#b2d8d9", "#293c40"], vh: ["#a9dec4", "#273a31"], inline: ["#bdb2e0", "#332f3f"], tailwind: ["#cdc85a", "#36351f"] };
    const mode = q.get("mode") || "rem";
    document.documentElement.style.setProperty("--accent", accents[mode][0]);
    document.documentElement.style.setProperty("--glow", accents[mode][1]);
    kicker.textContent = q.get("kicker") || "";
    title.innerHTML = (q.get("title") || "").replace(/\|/g, "<br>");
    text.textContent = q.get("text") || "";
    if (q.get("cover")) chips.innerHTML = [["PX ⇄ REM", "#f4b506"], ["REM ⇄ EM", "#ff5102"], ["PX ⇄ VW", "#b2d8d9"], ["PX ⇄ VH", "#014a2c", "#effff7"], ["CSS → INLINE", "#9d92b8"], ["CSS → TAILWIND", "#8f8b1c"]]
      .map(([label, c, t]) => `<span style="--c:${c};${t ? `--t:${t}` : ""}">${label}</span>`).join("");

    // Selections like the ones Figma sends, so the UI shows real behaviour.
    const selections = {
      rem: { name: "Heading", type: "TEXT", width: 540, height: 58, fontSize: 48, frame: { name: "Desktop", width: 1440, height: 900 }, css: {} },
      em: { name: "Body", type: "TEXT", width: 480, height: 24, fontSize: 20, frame: { name: "Desktop", width: 1440, height: 900 }, css: {} },
      vw: { name: "Hero card", type: "FRAME", width: 480, height: 320, fontSize: null, frame: { name: "Desktop", width: 1440, height: 900 }, css: {} },
      vh: { name: "Hero card", type: "FRAME", width: 480, height: 320, fontSize: null, frame: { name: "Desktop", width: 1440, height: 900 }, css: {} },
      inline: { name: "Button", type: "FRAME", width: 160, height: 44, fontSize: null, frame: { name: "Email", width: 600, height: 1200 }, css: { display: "flex", padding: "12px 20px", "justify-content": "center", "align-items": "center", "border-radius": "999px", background: "#F4B506" } },
      tailwind: { name: "Pricing card", type: "FRAME", width: 360, height: 420, fontSize: null, frame: { name: "Desktop", width: 1440, height: 900 }, css: { display: "flex", width: "360px", padding: "32px", "flex-direction": "column", "align-items": "flex-start", gap: "24px", "border-radius": "16px", background: "#FFF", "box-shadow": "0 8px 24px 0 rgba(0, 0, 0, 0.12)" } },
    };
    plugin.addEventListener("load", () => {
      const w = plugin.contentWindow;
      w.document.querySelector(`.tab[data-mode="${mode}"]`).click();
      w.dispatchEvent(new w.MessageEvent("message", { data: { pluginMessage: { type: "selection", node: selections[mode], count: 1 } } }));
      document.body.dataset.ready = "1";
    });
  </script>
</body>
</html>
